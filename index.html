<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Финансы">
<meta name="theme-color" content="#05070A">
<title>Финансы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Golos+Text:wght@400;500;600;700&family=Onest:wght@400;500;600&display=swap">
<style>
:root{
--ink:#05070A; --ink-2:#0C1014; --line:#1C2126; --line-2:#242B30;
--text:#F2F4F2; --mute:#8C9499; --lime:#C6FF3D; --lime-deep:#7FB400;
--bone:#EDF2E6; --warm:#FFB86B; --bad:#FF8A8A;
--display:"Unbounded","Trebuchet MS",sans-serif;
--grotesk:"Golos Text","Helvetica Neue",sans-serif;
--body:"Onest","Helvetica Neue",system-ui,sans-serif;
color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;padding:0;transition:transform .12s ease}
button:active{transform:scale(.97)}
input{outline:none}
.num{font-variant-numeric:tabular-nums}

.app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
header{padding:calc(env(safe-area-inset-top) + 16px) 20px 10px;display:flex;flex-direction:column;gap:12px;flex:none}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.hbtns{display:flex;align-items:center;gap:8px;flex:none}
.mnav{display:flex;align-items:center;gap:2px;background:var(--ink-2);border:1px solid var(--line);border-radius:19px;padding:3px}
.mnav button{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.mnav button[disabled]{color:#2F3840}
.mnav span{font-size:12.5px;min-width:86px;text-align:center;font-family:var(--grotesk)}
.gear{width:36px;height:36px;border-radius:18px;background:var(--ink-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--ink-2);color:var(--mute);font-size:13.5px;font-weight:600}
.tab.on{background:var(--text);color:var(--ink);border-color:var(--text)}

.pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{flex:none;width:100%;height:100%;scroll-snap-align:start;overflow-y:auto;scrollbar-width:none;
padding:6px 20px calc(env(safe-area-inset-bottom) + 108px);display:flex;flex-direction:column;gap:13px}
.page::-webkit-scrollbar{display:none}
.page > *{flex:0 0 auto}

/* карта-герой */
.hero{position:relative;border-radius:26px;padding:24px 20px 22px;overflow:hidden;
background:linear-gradient(160deg,#132C15 0%,#0B1410 46%,var(--ink-2) 100%);
border:1px solid #23381F;box-shadow:0 24px 50px -28px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07)}
.hero::after{content:"";position:absolute;left:50%;top:-62%;width:150%;aspect-ratio:1;transform:translateX(-50%);
background:radial-gradient(circle,rgba(198,255,61,.2),transparent 62%);pointer-events:none}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.16) 48%,transparent 58%);transform:translateX(-120%)}
.hero.sweep::before{animation:sweep .9s ease}
@keyframes sweep{to{transform:translateX(120%)}}
.hero.flat{background:linear-gradient(160deg,#16211A 0%,#0B1013 50%,var(--ink-2) 100%);border-color:#222C26}
.hero.flat::after{background:radial-gradient(circle,rgba(198,255,61,.11),transparent 62%)}
.cap{position:relative;font-size:11px;letter-spacing:.16em;color:var(--lime-deep);font-weight:700}
.cap.q{color:#6F7C82}
.sum{position:relative;font-family:var(--display);font-weight:900;font-size:clamp(34px,10.5vw,48px);line-height:1;margin-top:11px;
color:var(--lime);text-shadow:0 0 26px rgba(198,255,61,.45),0 0 70px rgba(198,255,61,.18);word-break:break-word}
.sum.pale{color:var(--text);text-shadow:none}
.sum.long{font-size:clamp(27px,8.4vw,39px)}
.sum.xlong{font-size:clamp(22px,6.8vw,32px);letter-spacing:-.02em}
.env .v.long{font-size:clamp(25px,7.6vw,35px)}
.env .v.xlong{font-size:clamp(21px,6.4vw,29px)}
.tabsw{position:relative}
.tabsw::after{content:"";position:absolute;right:0;top:0;bottom:0;width:26px;pointer-events:none;
background:linear-gradient(90deg,transparent,var(--ink))}
.slot{position:relative;min-height:28px;margin-top:7px}
.slot .sl{position:absolute;inset:0;display:flex;align-items:center;color:var(--mute);font-size:13px;transition:opacity .25s}
.slot .sl.hide{opacity:0}
.slot .riser{position:absolute;inset:0;display:flex;align-items:center;font-family:var(--display);font-weight:900;
font-size:21px;color:var(--lime);opacity:0;transform:translateY(24px);text-shadow:0 0 22px rgba(198,255,61,.5);pointer-events:none}
.slot .riser.go{animation:riseup 1.3s cubic-bezier(.2,.8,.2,1)}
@keyframes riseup{0%{opacity:0;transform:translateY(24px)}24%{opacity:1;transform:translateY(0)}
70%{opacity:1;transform:translateY(-2px)}100%{opacity:0;transform:translateY(-15px)}}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.06);border-radius:20px;padding:4px;margin-top:16px}
.seg button{height:36px;border-radius:16px;font-size:14px;font-weight:600;color:var(--mute)}
.seg button.on{background:rgba(255,255,255,.13);color:var(--text)}
.rate{position:relative;margin-top:10px;font-size:12.5px;color:var(--mute);text-align:left}
.rate u{text-decoration-color:#394149;text-underline-offset:3px}

/* столбики по месяцам */
.months{position:relative;margin-top:18px}
.mread{display:flex;align-items:baseline;gap:8px;font-family:var(--grotesk);font-size:12.5px;color:var(--mute);min-height:20px}
.mread b{color:var(--text);font-size:16px;font-weight:600}
.mbars{display:flex;gap:10px;align-items:flex-end;height:72px;margin-top:8px}
.mbars button{flex:0 1 52px;max-width:52px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.mbars i{display:block;border-radius:5px 5px 0 0;background:linear-gradient(var(--lime-deep),rgba(127,180,0,.18));transition:height .35s}
.mbars button.on i{background:linear-gradient(var(--lime),rgba(198,255,61,.22));box-shadow:0 0 18px rgba(198,255,61,.3)}
.mlab{display:flex;gap:10px;margin-top:7px}
.mlab i{flex:0 1 52px;max-width:52px;text-align:center;font-style:normal;font-size:11px;color:var(--mute);letter-spacing:.08em}
.mlab i.on{color:var(--lime)}

/* списки */
.list{border:1px solid var(--line);border-radius:22px;background:var(--ink-2);overflow:hidden}
.li{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;
border-top:1px solid var(--line);font-family:var(--grotesk);text-align:left;color:var(--text)}
.li:first-child{border-top:none}
.li small{display:block;color:var(--mute);font-size:11.5px;margin-top:3px;font-weight:400}
.li b{font-weight:600;font-size:16px;white-space:nowrap}
.sec{font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:700;padding:8px 4px 0}
.empty{font-size:14px;color:var(--mute);text-align:center;padding:22px 0}

/* цель */
.goal{border:1px solid #23381F;border-radius:22px;background:linear-gradient(150deg,#122414,#0B1013);padding:18px;display:flex;flex-direction:column;gap:11px}
.goal .gt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--grotesk);font-size:13px;color:var(--mute)}
.goal .gt b{color:var(--lime);font-size:16px}
.gbar{height:11px;border-radius:6px;background:#172118;overflow:hidden}
.gbar i{display:block;height:11px;border-radius:6px;background:linear-gradient(90deg,var(--lime-deep),var(--lime));box-shadow:0 0 16px rgba(198,255,61,.4);transition:width .5s}

/* в процессе */
.pend{display:flex;align-items:center;gap:11px;padding:14px 16px;border-top:1px solid var(--line);font-family:var(--grotesk)}
.pend:first-child{border-top:none}
.pend .pt{flex:1;min-width:0;text-align:left;color:var(--text)}
.pend .pt b{display:block;font-size:15px;font-weight:500}
.pend .pt small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.pend .pv{color:var(--mute);font-size:15px;white-space:nowrap}
.ok{width:40px;height:40px;border-radius:20px;border:2px solid #2C353B;color:transparent;
display:flex;align-items:center;justify-content:center;flex:none;transition:.25s}
.ok.on{background:var(--lime);border-color:var(--lime);color:#0A1402;box-shadow:0 0 20px rgba(198,255,61,.45)}

/* плитки */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{border:1px solid var(--line);border-radius:22px;background:var(--ink-2);padding:16px;display:flex;flex-direction:column;gap:9px;text-align:left;color:var(--text)}
.tile em{font-style:normal;color:var(--mute);font-size:12.5px}
.tile b{font-family:var(--grotesk);font-size:19px;font-weight:600}
.tbar{height:4px;border-radius:2px;background:#1A2125;overflow:hidden}
.tbar i{display:block;height:4px;border-radius:2px;background:var(--warm)}
.tile small{color:var(--mute);font-size:11.5px}

/* конверт */
.env{position:relative;border-radius:22px;padding:22px 20px;overflow:hidden;background:var(--bone);color:#0A1402;
box-shadow:0 20px 44px -24px rgba(0,0,0,.9)}
.env::before{content:"";position:absolute;inset:-40% -10% auto;height:70%;background:rgba(10,20,2,.05);clip-path:polygon(0 0,100% 0,50% 100%)}
.env em{position:relative;font-style:normal;font-family:var(--grotesk);font-size:11px;letter-spacing:.14em;font-weight:700;opacity:.55}
.env .v{position:relative;font-family:var(--display);font-weight:900;font-size:clamp(30px,9vw,42px);line-height:1;margin-top:10px}
.env p{position:relative;margin:12px 0 0;font-size:12.5px;opacity:.6}

/* кнопки и шторки */
.fab{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:62px;height:62px;border-radius:31px;
background:var(--lime);color:#0A1402;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 34px rgba(198,255,61,.34);z-index:5}
.dots{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 34px);display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:#242B30}
.dots i.on{width:20px;background:var(--lime)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:10}
.sheet{width:100%;max-height:92%;overflow-y:auto;scrollbar-width:none;background:var(--ink-2);border-top:1px solid var(--line-2);
border-radius:28px 28px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 22px);display:flex;flex-direction:column;gap:16px}
.sheet::-webkit-scrollbar{display:none}
.sheet h2{margin:0;font-family:var(--display);font-size:19px;font-weight:700}
.x{width:38px;height:38px;border-radius:19px;border:1px solid var(--line-2);background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.field{display:flex;flex-direction:column;gap:9px}
.flab{font-size:12px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{height:42px;padding:0 15px;border-radius:21px;border:1px solid var(--line-2);background:var(--ink);font-size:13.5px;font-weight:600;color:var(--text)}
.chip.on{background:var(--lime);color:#0A1402;border-color:var(--lime)}
.chip.sm{height:38px;padding:0 13px;font-weight:500;font-size:13px}
.amount{display:flex;align-items:center;gap:10px;background:var(--ink);border:1px solid var(--line-2);border-radius:18px;padding:0 18px;height:66px}
.amount input{flex:1;min-width:0;background:none;border:none;font-family:var(--display);font-weight:700;font-size:26px}
.amount span{font-size:17px;font-weight:600;color:var(--lime)}
.share{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}
.share b{color:var(--lime);font-size:15px}
.txt{height:50px;background:var(--ink);border:1px solid var(--line-2);border-radius:16px;padding:0 16px;font-size:15px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);border:1px solid var(--line-2);
border-radius:18px;padding:14px 16px;text-align:left;color:var(--text)}
.toggle b{display:block;font-size:15px;font-weight:500}
.toggle small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.sw{width:50px;height:30px;border-radius:15px;background:#2C353B;display:flex;align-items:center;padding:3px;flex:none}
.sw i{width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .15s}
.toggle.on .sw{background:var(--lime)}
.toggle.on .sw i{transform:translateX(20px)}
.btns{display:flex;gap:10px}
.primary{flex:1;height:56px;border-radius:18px;background:var(--lime);color:#0A1402;font-size:16px;font-weight:700}
.primary[disabled]{opacity:.35}
.ghost{flex:none;padding:0 18px;height:56px;border-radius:18px;border:1px solid var(--line-2);background:var(--ink);font-size:15px;font-weight:600}
.wide{width:100%;height:50px;border-radius:16px;border:1px solid var(--line-2);background:var(--ink);font-size:14.5px;font-weight:600}
.danger{color:var(--bad)}
.hint{font-size:12px;color:var(--mute);line-height:1.5}
#fx{position:absolute;inset:0;pointer-events:none;z-index:8}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 18px);transform:translateX(-50%);font-size:11.5px;color:var(--mute);
background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:4px 11px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="hrow">
    <h1 id="title">Обзор</h1>
    <div class="hbtns">
      <div class="mnav">
        <button id="mprev" aria-label="Предыдущий месяц"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span id="mlabel">—</span>
        <button id="mnext" aria-label="Следующий месяц"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <button class="gear" id="gear" aria-label="Настройки"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
  </div>
  <div class="tabsw"><div class="tabs" id="tabs"></div></div>
</header>
<div class="pages" id="pages">
  <section class="page" id="p0"></section>
  <section class="page" id="p1"></section>
  <section class="page" id="p2"></section>
  <section class="page" id="p3"></section>
  <section class="page" id="p4"></section>
</div>
<div class="dots" id="dots"></div>
<button class="fab" id="fab" aria-label="Добавить запись"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>
<div id="modal"></div>
</div>

<script>
(function(){
"use strict";

var APP_VERSION = "12 ноября, 13:00";
var TABS = ["Обзор","Чаттинг","Vinted","Расходы","Наличные"];
var MN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var MSHORT = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
var MNOM = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var PLATFORMS = [["MV","LOCO",25],["OnlyFans","OF",25],["Другое",null,0]];
var ACCOUNTS = ["Аккаунт 1","Аккаунт 2","Аккаунт 3"];
var CATS = ["Подписки","Vinted","Техника","Лично","Разное"];
var VSUB = ["Закупка","Перегон","Прокси","ADS Power","Другое"];

var DB = null, recs = {}, LS = "fin_v1";
var settings = { rate:3.93, goalChat:1000, goalVinted:3000, tpls:[] };
var ui = { page:0, cur:"usd", month:null, mpick:null, modal:null, draft:null, justDone:null };

function pad(n){ return n<10 ? "0"+n : ""+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function ym(iso){ return String(iso).slice(0,7); }
function dayOf(iso){ return parseInt(String(iso).slice(8,10),10); }
function mIdx(key){ return parseInt(key.split("-")[1],10)-1; }
function monthName(key){ return MNOM[mIdx(key)]+" "+key.split("-")[0]; }
function genOf(key){ return MN[mIdx(key)]; }
function shortOf(key){ return MSHORT[mIdx(key)]; }
function shiftMonth(key,d){ var p=key.split("-"); var x=new Date(+p[0], +p[1]-1+d, 1); return x.getFullYear()+"-"+pad(x.getMonth()+1); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function nf(n){
  var s = Math.abs(n).toFixed(2).replace(".",",").split(",");
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return (n<0?"−":"")+s.join(",");
}
function usdOf(r){ return r.cur==="usd" ? r.amount : r.amount/settings.rate; }
function money(usd){ return ui.cur==="usd" ? (usd<0?"−":"")+"$"+Math.abs(usd).toFixed(2) : nf(usd*settings.rate)+" zł"; }
function moneyPln(p){ return ui.cur==="usd" ? (p<0?"−":"")+"$"+Math.abs(p/settings.rate).toFixed(2) : nf(p)+" zł"; }
function moneyRec(r){ return money(usdOf(r)); }
function fitCls(str){ var n = String(str).length; return n>=14 ? " xlong" : n>=11 ? " long" : ""; }

function list(){ var a=[]; for(var k in recs) if(recs[k]) a.push(recs[k]); return a; }
function inMonth(key,kind){
  return list().filter(function(r){ return ym(r.date)===key && r.kind===kind; })
    .sort(function(a,b){ return dayOf(b.date)-dayOf(a.date) || (b.at||0)-(a.at||0); });
}
function sumUsd(a){ return a.reduce(function(s,r){ return s+usdOf(r); },0); }
function monthsAvailable(){
  var cur = ym(todayISO()), keys = {}; keys[cur]=1;
  list().forEach(function(r){ keys[ym(r.date)]=1; });
  var all = Object.keys(keys).sort(), oldest = all[0];
  var out=[], k=cur, guard=0;
  while(guard++<80){ out.push(k); if(k<=oldest) break; k=shiftMonth(k,-1); }
  while(out.length<2) out.push(shiftMonth(out[out.length-1],-1));
  return out;
}
/* доход месяца: чаттинг + vinted завершённые + другое + списания наличных не считаем */
function incomeOf(key){
  return sumUsd(inMonth(key,"chat"))
       + sumUsd(inMonth(key,"vinted").filter(function(r){ return !r.pending; }))
       + sumUsd(inMonth(key,"other"));
}
/* расходы месяца: записи-расходы + траты наличных */
function expenseOf(key){
  return sumUsd(inMonth(key,"expense"))
       + sumUsd(inMonth(key,"cash").filter(function(r){ return r.amount<0; })) * -1;
}

/* ---------- хранение ---------- */
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify({recs:recs, settings:settings})); }catch(e){} }
function loadLocal(){
  try{
    var raw = localStorage.getItem(LS); if(!raw) return;
    var o = JSON.parse(raw);
    if(o && o.recs) recs = o.recs;

var cv, cx, bits = [], raf = null;
function sizeFx(){
  cv = document.getElementById("fx"); cx = cv.getContext("2d");
  var w = cv.offsetWidth, h = cv.offsetHeight, d = devicePixelRatio||1;
  cv.width = w*d; cv.height = h*d; cx.setTransform(d,0,0,d,0,0);
}
function burst(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(!cv) sizeFx();
  var W = cv.offsetWidth, H = cv.offsetHeight;
  var cols = ["#C6FF3D","#9FD93A","#7FB400","#EDF2E6"];
  for(var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2, sp = 3+Math.random()*7;
    bits.push({x:W/2,y:H*0.33,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,
      w:4+Math.random()*5,h:7+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:cols[(Math.random()*cols.length)|0],life:0});
  }
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  var W = cv.offsetWidth, H = cv.offsetHeight;
  cx.clearRect(0,0,W,H);
  for(var i=bits.length-1;i>=0;i--){
    var b = bits[i];
    b.vy += .22; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life++;
    if(b.y > H+40 || b.life > 200){ bits.splice(i,1); continue; }
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r);
    cx.globalAlpha = Math.max(0, 1-b.life/180);
    cx.fillStyle = b.c; cx.fillRect(-b.w/2,-b.h/2,b.w,b.h); cx.restore();
  }
  if(bits.length) raf = requestAnimationFrame(tick); else { raf=null; cx.clearRect(0,0,W,H); }
}

var shownTotal = null;
function rollHero(to){
  var el = document.getElementById("heroSum");
  if(!el) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches || shownTotal===null){
    el.textContent = money(to); shownTotal = to; return;
  }
  var from = shownTotal; shownTotal = to;
  if(Math.abs(to-from) < 0.005){ el.textContent = money(to); return; }
  var t0 = null;
  function step(ts){
    if(t0===null) t0 = ts;
    var k = Math.min((ts-t0)/700,1), e = 1-Math.pow(1-k,3);
    var node = document.getElementById("heroSum"); if(!node) return;
    node.textContent = money(from+(to-from)*e);
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function celebrate(deltaUsd){
  var ri = document.getElementById("riser"), sl = document.getElementById("heroSl");
  if(ri){
    ri.textContent = "+"+money(deltaUsd);

  var hero = document.getElementById("hero");

  burst(70);
}

  var r = recs[ui.modal.id]; if(!r) return "";
  var d = ui.draft;
  var amt = parseFloat(String(d.amount).replace(",",".")) || 0;
  var h = '<div class="hrow"><div><h2>'+esc(r.label)+'</h2><span class="hint">'+esc(r.sub||r.cat||"")+'</span></div>'+closeBtn()+'</div>';
  h += '<div class="field"><label class="flab" for="amt">'+(r.kind==="chat"&&r.pct?"Сумма продаж":"Сумма")+'</label>'
    + '<div class="amount"><input id="amt" inputmode="decimal" value="'+esc(d.amount)+'"><span>'+(r.cur==="usd"?"$":"zł")+'</span></div>'
    + (r.kind==="chat"&&r.pct ? '<div class="share"><span>Твоя доля · '+r.pct+'%</span><b class="num">$'+(amt*r.pct/100).toFixed(2)+'</b></div>' : "")
    + '</div>';
  h += '<div class="field"><label class="flab" for="dt">Дата</label><input class="txt" id="dt" type="date" value="'+esc(r.date)+'"></div>';
  h += '<div class="field"><label class="flab" for="nt">Заметка</label><input class="txt" id="nt" value="'+esc(r.note||"")+'"></div>';
  if(r.kind==="vinted" && r.pending)
    h += '<button class="wide" data-complete="1" style="color:var(--lime);border-color:#2C4420">Завершить продажу</button>';
  h += '<div class="btns"><button class="ghost danger" data-delete="1">Удалить</button><button class="primary" data-update="1">Сохранить</button></div>';
  return h;
}

function gearSheet(){
  var d = ui.draft || {};
  return '<div class="hrow"><h2>Настройки</h2>'+closeBtn()+'</div>'
  + '<div class="field"><label class="flab" for="amt">Курс: 1 USD в злотых</label>'
  + '<div class="amount"><input id="amt" inputmode="decimal" value="'+esc(d.rate!=null?d.rate:String(settings.rate).replace(".",","))+'"><span>zł</span></div></div>'
  + '<div class="field"><label class="flab" for="g1">Цель по чаттингу, $ в месяц</label><input class="txt" id="g1" inputmode="decimal" value="'+settings.goalChat+'"></div>'
  + '<div class="field"><label class="flab" for="g2">Цель по Vinted, zł в месяц</label><input class="txt" id="g2" inputmode="decimal" value="'+settings.goalVinted+'"></div>'
  + '<div class="btns"><button class="primary" data-setsave="1">Сохранить</button></div>'
  + ((settings.tpls && settings.tpls.length) ? '<div class="field"><span class="flab">Повторяющиеся расходы</span><div class="list">'
      + settings.tpls.map(function(t){
          return '<div class="li"><span>'+esc(t.label)+'<small>'+(t.sub?esc(t.sub)+' · ':'')+nf(t.amount)+' zł · '+t.day+' числа</small></span>'
          + '<button class="x danger" data-untpl="'+esc(t.id)+'" aria-label="Убрать повтор"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>';
        }).join("")+'</div><span class="hint">Крестик убирает только повтор, уже созданные записи остаются.</span></div>' : "")
  + '<div class="field"><span class="flab">Данные</span>'
  + '<textarea id="io" class="txt" style="height:120px;padding:12px 16px;resize:none;line-height:1.4;font-size:12.5px;background:var(--ink);border:1px solid var(--line-2);border-radius:16px;color:var(--text)" placeholder="Вставьте сюда текст для импорта"></textarea></div>'
  + '<div class="btns"><button class="ghost" data-export="1">Выгрузить</button><button class="primary" data-import="1">Добавить записи</button></div>'
  + '<span class="hint">«Выгрузить» показывает все записи текстом — это резервная копия, сохраните её себе.</span>'
  + '<span class="hint" style="text-align:center">Версия приложения: '+APP_VERSION+'</span>'
  + '<button class="wide danger" data-clear="1">'+((ui.draft&&ui.draft.confirmClear)?"Нажмите ещё раз — записи сотрутся":"Удалить все записи")+'</button>';
}

function importRecords(text){
  var arr;
  try{ arr = JSON.parse(text); }catch(e){ return "текст не читается"; }
  if(!arr || typeof arr.length!=="number") return "это не список записей";
  var ok=0, bad=0;
  arr.forEach(function(o){
    if(!o || typeof o!=="object"){ bad++; return; }
    if(["chat","vinted","other","expense","cash"].indexOf(o.kind)<0){ bad++; return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(o.date||""))){ bad++; return; }
    var a = Number(o.amount);
    if(!isFinite(a) || a===0){ bad++; return; }
    var id = (typeof o.id==="string" && o.id && !recs[o.id]) ? o.id : newId();
    var rec = { id:id, kind:o.kind, date:o.date, cur:(o.cur==="usd"?"usd":"pln"), amount:a,
      label:String(o.label||"Запись"), sub:o.sub?String(o.sub):"", note:o.note?String(o.note):"", at:Date.now() };
    if(o.kind==="chat"){ rec.pct=o.pct?Number(o.pct):null; rec.sales=o.sales?Number(o.sales):null; rec.agency=o.agency?String(o.agency):null; }
    if(o.kind==="vinted") rec.pending = !!o.pending;
    if(o.cat) rec.cat = String(o.cat);
    if(o.tpl) rec.tpl = String(o.tpl);
    recs[id]=rec; ok++;
    if(DB) DB.collection("records").doc(id).set(rec).then(function(){},function(){});
  });
  saveLocal(); render();
  return "добавлено: "+ok+(bad?", пропущено: "+bad:"");
}

function renderModal(){
  var host = document.getElementById("modal");
  if(!ui.modal){ host.innerHTML=""; return; }
  var inner = ui.modal.kind==="add" ? addSheet() : ui.modal.kind==="edit" ? editSheet() : gearSheet();
  host.innerHTML = '<div class="scrim" data-scrim="1"><div class="sheet">'+inner+'</div></div>';
}

/* ---------- рендер ---------- */
function render(){
  var months = monthsAvailable();
  if(!ui.month || months.indexOf(ui.month)<0) ui.month = months[0];
  var idx = months.indexOf(ui.month);
  document.getElementById("title").textContent = TABS[ui.page];
  document.getElementById("mlabel").textContent = monthName(ui.month);
  document.getElementById("mprev").disabled = idx>=months.length-1;
  document.getElementById("mnext").disabled = idx<=0;
  document.getElementById("tabs").innerHTML = TABS.map(function(t,i){
    return '<button class="tab'+(i===ui.page?" on":"")+'" data-tab="'+i+'">'+t+'</button>'; }).join("");
  document.getElementById("dots").innerHTML = TABS.map(function(t,i){
    return '<i class="'+(i===ui.page?"on":"")+'"></i>'; }).join("");
  var k = ui.month;
  document.getElementById("p0").innerHTML = pageOverview(k);
  document.getElementById("p1").innerHTML = pageChat(k);
  document.getElementById("p2").innerHTML = pageVinted(k);
  document.getElementById("p3").innerHTML = pageExpenses(k);
  document.getElementById("p4").innerHTML = pageCash(k);
  renderModal();
  sizeFx();
}
function goPage(i){
  ui.page = Math.max(0, Math.min(TABS.length-1, i));
  var pages = document.getElementById("pages");
  pages.scrollTo({ left: ui.page*pages.clientWidth, behavior:"smooth" });
  render();
}

/* ---------- события ---------- */
document.getElementById("pages").addEventListener("scroll", function(){
  var p = Math.round(this.scrollLeft/this.clientWidth);
  if(p!==ui.page){
    ui.page = p;
    document.getElementById("title").textContent = TABS[p];
    document.querySelectorAll("#tabs .tab").forEach(function(b,i){ b.classList.toggle("on", i===p); });
    document.querySelectorAll("#dots i").forEach(function(b,i){ b.classList.toggle("on", i===p); });
  }
});
document.getElementById("mprev").addEventListener("click", function(){
  var m = monthsAvailable(), i = m.indexOf(ui.month);
  if(i<m.length-1){ ui.month=m[i+1]; ui.mpick=null; shownTotal=null; render(); }
});
document.getElementById("mnext").addEventListener("click", function(){
  var m = monthsAvailable(), i = m.indexOf(ui.month);
  if(i>0){ ui.month=m[i-1]; ui.mpick=null; shownTotal=null; render(); }
});
document.getElementById("gear").addEventListener("click", function(){
  ui.draft = {}; ui.modal = { kind:"gear" }; renderModal();
});
document.getElementById("fab").addEventListener("click", function(){
  ui.draft = { type:"income", src:"Чаттинг", label:"MV", sub:VSUB[0], amount:"", pending:false,
               date:todayISO(), note:"", cashIn:true, cat:"Лично" };
  ui.modal = { kind:"add" }; renderModal();
});

document.body.addEventListener("click", function(e){
  var t = e.target.closest("[data-tab],[data-go],[data-cur],[data-rate],[data-m],[data-edit],[data-finish],[data-close],[data-scrim],[data-type],[data-src],[data-sub],[data-label],[data-from],[data-to],[data-cat],[data-cashin],[data-pending],[data-save],[data-update],[data-delete],[data-complete],[data-setsave],[data-export],[data-import],[data-clear],[data-repeat],[data-untpl]");
  if(!t) return;
  var d = t.dataset, dr = ui.draft || {};

  if(d.scrim!==undefined && t===e.target){ ui.modal=null; renderModal(); return; }
  if(d.close!==undefined){ ui.modal=null; renderModal(); return; }
  if(d.tab!==undefined){ goPage(+d.tab); return; }
  if(d.go!==undefined){ goPage(+d.go); return; }
  if(d.cur!==undefined){ ui.cur=d.cur; shownTotal=null; render(); return; }
  if(d.m!==undefined){ ui.mpick=d.m; render(); return; }
  if(d.rate!==undefined){ ui.draft={}; ui.modal={kind:"gear"}; renderModal(); return; }

  if(d.finish!==undefined){
    var fid = d.finish;
    ui.justDone = fid; render();
    setTimeout(function(){
      var fr = recs[fid]; ui.justDone = null;
      if(!fr){ render(); return; }
      var fc = JSON.parse(JSON.stringify(fr)); fc.pending = false;
      shownTotal = null;
      putRec(fid, fc); burst(45); flash("продажа завершена");
    }, 420);
    return;
  }
  if(d.edit!==undefined){
    var r = recs[d.edit]; if(!r) return;
    ui.draft = { amount: String(r.kind==="chat"&&r.pct ? (r.sales||r.amount) : Math.abs(r.amount)).replace(".",",") };
    ui.modal = { kind:"edit", id:d.edit }; renderModal(); return;
  }

  /* внутри шторок */
  if(d.type!==undefined){
    dr.type = d.type;
    dr.src = d.type==="income" ? "Чаттинг" : CATS[0];
    dr.label = d.type==="income" ? "MV" : CATS[0];
    dr.pending = false; renderModal(); return;
  }
  if(d.src!==undefined){
    dr.src = d.src;
    if(dr.type==="income") dr.label = d.src==="Чаттинг" ? "MV" : d.src==="Vinted" ? ACCOUNTS[0] : d.src;
    else { dr.label = d.src; dr.sub = VSUB[0]; }
    dr.pending = false; renderModal(); return;
  }
  if(d.sub!==undefined){ dr.sub=d.sub; renderModal(); return; }
  if(d.label!==undefined){ dr.label=d.label; renderModal(); return; }
  if(d.from!==undefined){ dr.from=d.from; renderModal(); return; }
  if(d.to!==undefined){ dr.to=d.to; renderModal(); return; }
  if(d.cat!==undefined){ dr.cat=d.cat; renderModal(); return; }
  if(d.cashin!==undefined){ dr.cashIn = d.cashin==="1"; renderModal(); return; }
  if(d.pending!==undefined){ dr.pending = !dr.pending; renderModal(); return; }
  if(d.repeat!==undefined){ dr.repeat = !dr.repeat; renderModal(); return; }

  if(d.save!==undefined){
    var v = parseFloat(String(document.getElementById("amt").value).replace(",",".")); if(!(v>0)) return;
    var date = document.getElementById("dt").value || todayISO();
    var note = document.getElementById("nt").value || "";
    var id = newId(), rec, delta = 0;
    if(dr.type==="income" && dr.src==="Чаттинг"){
      var p = PLATFORMS.filter(function(x){ return x[0]===dr.label; })[0] || PLATFORMS[0];
      var own = p[2] ? v*p[2]/100 : v;
      rec = { id:id, kind:"chat", cur:"usd", amount:own, sales:p[2]?v:null, pct:p[2]||null, agency:p[1],
        label:p[0], sub:(p[1]?p[1]:"")+(p[2]?" · "+p[2]+"%":" · своя сумма"), date:date, note:note, at:Date.now() };
      delta = own;
    } else if(dr.type==="income" && dr.src==="Vinted"){
      rec = { id:id, kind:"vinted", cur:"pln", amount:v, label:"Продажа", sub:dr.label, pending:!!dr.pending, date:date, note:note, at:Date.now() };
      delta = dr.pending ? 0 : v/settings.rate;
    } else if(dr.type==="income"){
      rec = { id:id, kind:"other", cur:"pln", amount:v, label:"Другое", sub:"Доход", date:date, note:note, at:Date.now() };
      delta = v/settings.rate;
    } else if(dr.type==="cash"){
      var out = dr.cashIn===false;
      rec = { id:id, kind:"cash", cur:"pln", amount: out?-v:v, label: out?"Взял":"Положил",
        sub: out?"":"Наличные дома", date:date, note:note, at:Date.now() };
      if(out) rec.cat = dr.cat||"Лично";
    } else {
      var esub = "";
      if(dr.src==="Vinted"){
        esub = dr.sub||VSUB[0];
        if(dr.sub==="Перегон") esub = "Перегон · "+(dr.from||ACCOUNTS[1])+" → "+(dr.to||ACCOUNTS[0]);
      }
      rec = { id:id, kind:"expense", cur:"pln", amount:v, label:dr.src, sub:esub, date:date, note:note, at:Date.now() };
      if(dr.repeat){
        var tid = "t"+Date.now().toString(36);
        settings.tpls = (settings.tpls||[]).concat([{ id:tid, label:dr.src, sub:esub, amount:v, cur:"pln", day:dayOf(date), note:note }]);
        rec.tpl = tid; putSettings();
      }
    }
    ui.modal = null; ui.month = ym(date); ui.mpick = null;
    putRec(id, rec);
    if(delta>0 && ui.month===ym(todayISO())){ goPage(0); setTimeout(function(){ rollHero(incomeOf(ui.month)); celebrate(delta); }, 60); }
    return;
  }

  if(d.update!==undefined){
    var r2 = recs[ui.modal.id]; if(!r2) return;
    var v2 = parseFloat(String(document.getElementById("amt").value).replace(",",".")); if(!(v2>0)) return;
    var c = JSON.parse(JSON.stringify(r2));
    if(c.kind==="chat" && c.pct){ c.sales=v2; c.amount=v2*c.pct/100; c.sub=(c.agency?c.agency+" · ":"")+c.pct+"%"; }
    else if(c.kind==="cash") c.amount = c.amount<0 ? -v2 : v2;
    else c.amount = v2;
    c.date = document.getElementById("dt").value || c.date;
    c.note = document.getElementById("nt").value || "";
    ui.modal=null; ui.month=ym(c.date); shownTotal=null; putRec(c.id, c); return;
  }
  if(d.complete!==undefined){
    var r3 = recs[ui.modal.id]; if(!r3) return;
    var c3 = JSON.parse(JSON.stringify(r3)); c3.pending=false;
    var v3 = parseFloat(String(document.getElementById("amt").value).replace(",",".")); if(v3>0) c3.amount=v3;
    ui.modal=null; shownTotal=null; putRec(c3.id, c3); burst(45); return;
  }
  if(d.delete!==undefined){ var id4=ui.modal.id; ui.modal=null; shownTotal=null; delRec(id4); return; }

  if(d.setsave!==undefined){
    var rv = parseFloat(String(document.getElementById("amt").value).replace(",","."));
    if(rv>0.5 && rv<20) settings.rate = rv;
    var g1 = parseFloat(document.getElementById("g1").value), g2 = parseFloat(document.getElementById("g2").value);
    if(g1>0) settings.goalChat = g1;
    if(g2>0) settings.goalVinted = g2;
    putSettings(); ui.modal=null; shownTotal=null; render(); flash("настройки сохранены"); return;
  }
  if(d.untpl!==undefined){
    settings.tpls = (settings.tpls||[]).filter(function(t){ return t.id!==d.untpl; });
    putSettings(); renderModal(); flash("повтор убран"); return;
  }
  if(d.export!==undefined){
    var ta = document.getElementById("io");
    ta.value = JSON.stringify(list(), null, 1); ta.focus(); ta.select();
    flash("скопируйте текст"); return;
  }
  if(d.import!==undefined){
    var msg = importRecords(document.getElementById("io").value||"");
    ui.modal=null; shownTotal=null; render(); flash(msg); return;
  }
  if(d.clear!==undefined){
    if(!ui.draft.confirmClear){ ui.draft.confirmClear = true; renderModal(); return; }
    var ids = Object.keys(recs); recs = {}; saveLocal();
    if(DB) ids.forEach(function(x){ DB.collection("records").doc(x).delete().then(function(){},function(){}); });
    ui.modal=null; shownTotal=null; render(); flash("стёрто: "+ids.length); return;
  }
});

document.body.addEventListener("input", function(e){
  if(e.target.id!=="amt" || !ui.modal) return;
  ui.draft.amount = e.target.value;
  var sheet = e.target.closest(".sheet"); if(!sheet) return;
  var save = sheet.querySelector("[data-save]");
  var v = parseFloat(String(e.target.value).replace(",",".")) || 0;
  if(save) save.disabled = !(v>0);
  var sh = sheet.querySelector(".share");
  if(sh){
    var m = /(\d+)%/.exec(sh.textContent);
    if(m) sh.querySelector("b").textContent = "$"+(v*(+m[1])/100).toFixed(2);
  }
});
addEventListener("resize", function(){ sizeFx(); });

/* ---------- старт ---------- */
loadLocal();
applyTemplates();
render();

var hasClaude = false;
try{ hasClaude = (typeof claude!=="undefined") && !!claude && typeof claude.use==="function"; }catch(e){ hasClaude=false; }
if(hasClaude) claude.use("db").then(function(db){
  if(!db) return;
  DB = db;
  DB.doc("settings/app").onSnapshot(function(s){
    if(s.exists && s.data()){ var o=s.data(); for(var k in o) if(o[k]!=null) settings[k]=o[k]; saveLocal(); shownTotal=null; render(); }
  }, function(){});
  DB.collection("records").onSnapshot(function(snap){
    var fresh = {};
    snap.docs.forEach(function(doc){ var o=doc.data()||{}; o.id=doc.id; fresh[doc.id]=o; });
    var localOnly = Object.keys(recs).filter(function(k){ return !fresh[k]; });
    if(snap.empty && localOnly.length){
      localOnly.forEach(function(k){ DB.collection("records").doc(k).set(recs[k]); });
      return;
    }
    recs = fresh; applyTemplates(); saveLocal(); shownTotal=null; render();
  }, function(){});
}, function(){});

})();
</script>
