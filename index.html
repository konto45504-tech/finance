<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Финансы">
<meta name="theme-color" content="#000000">
<title>Финансы</title>
<style>
:root{
--bg:#000000; --card:#0E0E0E; --line:#1F1F1F; --line2:#262626;
--txt:#F2F2F2; --dim:#8E8E93; --acc:#B8F23A; --chip:#1A1A1A; --sel:#3A3A3C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
margin:0;background:var(--bg);color:var(--txt);
font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;
overscroll-behavior:none;
}
button,input,select{font-family:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;padding:0}
input{outline:none}
.app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
header{padding:calc(env(safe-area-inset-top) + 18px) 20px 10px;display:flex;flex-direction:column;gap:12px;flex:none}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-0.3px}
.mnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px;flex:none}
.mnav button{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--txt)}
.mnav button[disabled]{color:var(--sel)}
.mnav span{font-size:13px;min-width:96px;text-align:center}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line2);background:var(--card);color:var(--dim);font-size:14px;font-weight:500}
.tab.on{background:var(--txt);color:#000;border-color:var(--txt)}
.pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{flex:none;width:100%;height:100%;scroll-snap-align:start;overflow-y:auto;scrollbar-width:none;padding:8px 20px calc(env(safe-area-inset-bottom) + 110px);display:flex;flex-direction:column;gap:16px}
.page::-webkit-scrollbar{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:13px;color:var(--dim);letter-spacing:0.4px}
.big{font-size:40px;font-weight:600;letter-spacing:-0.8px;color:var(--acc)}
.mid{font-size:34px;font-weight:600;letter-spacing:-0.5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--chip);border-radius:22px;padding:4px}
.seg button{height:40px;border-radius:18px;font-size:15px;font-weight:500;color:var(--dim)}
.seg button.on{background:var(--sel);color:#fff}
.rate{font-size:13px;color:var(--dim);text-align:left}
.rate u{text-decoration-color:var(--sel);text-underline-offset:3px}
.legend{display:flex;gap:16px;font-size:13px;align-items:center}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.chartbox{position:relative;width:100%;height:140px}
.chartbox svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hit{position:absolute;inset:0;display:flex}
.hit button{flex:1;height:100%}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.selbox{background:#161616;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;color:var(--txt)}
.tile .v{font-size:19px;font-weight:500}
.bar{width:100%;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:4px;background:var(--acc);border-radius:2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 16px}
.item{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);text-align:left;color:var(--txt)}
.item:first-child{border-top:none}
.item .t{font-size:15px}
.item .s{font-size:12px;color:var(--dim);margin-top:3px}
.item .v{font-size:16px;font-weight:500;white-space:nowrap}
.dayhead{display:flex;justify-content:space-between;padding:0 4px 6px;font-size:14px}
.dayhead b{font-weight:500}
.group{display:flex;flex-direction:column;gap:4px}
.empty{font-size:14px;color:var(--dim);text-align:center;padding:24px 0}
.agname{font-size:15px;font-weight:600;letter-spacing:0.3px}
.agblock{display:flex;flex-direction:column;gap:14px;padding:18px 0;border-top:1px solid var(--line)}
.agblock:first-child{border-top:none}
.fab{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:62px;height:62px;border-radius:31px;background:var(--acc);color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(184,242,58,.28)}
.dots{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 34px);display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--sel)}
.dots i.on{width:18px;background:var(--acc)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;z-index:10}
.sheet{width:100%;max-height:92%;overflow-y:auto;scrollbar-width:none;background:var(--card);border-top:1px solid #222;border-radius:28px 28px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:18px}
.sheet::-webkit-scrollbar{display:none}
.sheet h2{margin:0;font-size:22px;font-weight:600}
.x{width:40px;height:40px;border-radius:20px;border:1px solid #2A2A2A;background:#141414;display:flex;align-items:center;justify-content:center;flex:none}
.field{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1px solid #2A2A2A;background:#000;font-size:14px;font-weight:500;color:var(--txt)}
.chip.on{background:var(--acc);color:#000;border-color:var(--acc)}
.chip.sm{height:40px;padding:0 14px;font-weight:400}
.chip.plain.on{background:var(--txt);color:#000;border-color:var(--txt)}
.amount{display:flex;align-items:center;gap:10px;background:#000;border:1px solid #222;border-radius:18px;padding:0 18px;height:70px}
.amount input{flex:1;min-width:0;background:none;border:none;font-size:32px;font-weight:500}
.amount span{font-size:18px;font-weight:500;color:var(--acc)}
.txt{height:52px;background:#000;border:1px solid #222;border-radius:16px;padding:0 16px;font-size:15px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#000;border:1px solid #222;border-radius:18px;padding:14px 16px;text-align:left;color:var(--txt)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--sel);display:flex;align-items:center;padding:3px;flex:none}
.sw i{width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .15s}
.toggle.on .sw{background:var(--acc)}
.toggle.on .sw i{transform:translateX(20px)}
.btns{display:flex;gap:10px}
.primary{flex:1;height:56px;border-radius:18px;background:var(--acc);color:#000;font-size:16px;font-weight:600}
.primary[disabled]{opacity:.4}
.ghost{flex:none;padding:0 20px;height:56px;border-radius:18px;border:1px solid #2A2A2A;background:#141414;font-size:15px;font-weight:500}
.danger{color:#FF8A8A}
.hint{font-size:12px;color:var(--dim)}
.sync{position:absolute;top:calc(env(safe-area-inset-top) + 22px);left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px 10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.sync.on{opacity:1}
</style>
</head>
<body>
<div class="app">
<header>
<div class="hrow">
<h1 id="title">Обзор</h1>
<div class="mnav">
<button id="mprev" aria-label="Предыдущий месяц"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<span id="mlabel">—</span>
<button id="mnext" aria-label="Следующий месяц"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
</div>
<div class="tabs" id="tabs"></div>
</header>
<div class="pages" id="pages">
<section class="page" id="p0"></section>
<section class="page" id="p1"></section>
<section class="page" id="p2"></section>
<section class="page" id="p3"></section>
<section class="page" id="p4"></section>
</div>
<div class="dots" id="dots"></div>
<button class="fab" id="fab" aria-label="Добавить запись"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
<div class="sync" id="sync">сохранено</div>
<div id="modal"></div>
</div>

<script>
(function(){
"use strict";

var TABS = ["Обзор","Чаттинг","Vinted","Расходы","Наличные"];
var MN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var MNOM = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var PLATFORMS = [["MV","LOCO",25],["4based","LOCO",25],["Fanvue","NO NAME",20],["OnlyFans","OF",25],["Другое",null,0]];
var ACCOUNTS = ["Аккаунт 1","Аккаунт 2","Аккаунт 3"];
var CATS = ["Подписки","Vinted","Одежда","Техника","Еда","Разное"];

var DB = null;
var recs = {};
var settings = { rate: 3.93 };
var ui = { page:0, cur:"usd", month:null, day:null, modal:null, draft:null };
var LS = "fin_v1";

function pad(n){ return n<10 ? "0"+n : ""+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function ym(iso){ return iso.slice(0,7); }
function dayOf(iso){ return parseInt(iso.slice(8,10),10); }
function daysIn(key){ var p=key.split("-"); return new Date(+p[0], +p[1], 0).getDate(); }
function monthName(key){ var p=key.split("-"); return MNOM[+p[1]-1]+" "+p[0]; }
function genOf(key){ return MN[+key.split("-")[1]-1]; }
function shiftMonth(key,delta){ var p=key.split("-"); var d=new Date(+p[0], +p[1]-1+delta, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function nf(n){
  var s = Math.abs(n).toFixed(2).replace(".",",");
  var parts = s.split(",");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return (n<0?"−":"")+parts.join(",");
}
function usdOf(r){ return r.cur==="usd" ? r.amount : r.amount/settings.rate; }
function money(usd){ return ui.cur==="usd" ? (usd<0?"−":"")+"$"+Math.abs(usd).toFixed(2) : nf(usd*settings.rate)+" zł"; }
function moneyRec(r){ return money(usdOf(r)); }

function list(){ var a=[]; for(var k in recs) if(recs[k]) a.push(recs[k]); return a; }
function monthsAvailable(){
  var cur = ym(todayISO());
  var keys = {}; keys[cur]=1;
  list().forEach(function(r){ keys[ym(r.date)]=1; });
  var all = Object.keys(keys).sort().reverse();
  var oldest = all[all.length-1];
  var out=[], k=cur, guard=0;
  while(guard++<60){ out.push(k); if(k<=oldest) break; k=shiftMonth(k,-1); }
  while(out.length<3){ out.push(shiftMonth(out[out.length-1],-1)); }
  return out;
}
function inMonth(key,kind){
  return list().filter(function(r){ return ym(r.date)===key && r.kind===kind; })
              .sort(function(a,b){ return dayOf(b.date)-dayOf(a.date) || (b.at||0)-(a.at||0); });
}
function sumUsd(arr){ return arr.reduce(function(s,r){ return s+usdOf(r); },0); }

/* ---------- storage ---------- */
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify({recs:recs, settings:settings})); }catch(e){} }
function loadLocal(){
  try{
    var raw = localStorage.getItem(LS); if(!raw) return;
    var o = JSON.parse(raw);
    if(o && o.recs) recs = o.recs;
    if(o && o.settings && o.settings.rate) settings.rate = o.settings.rate;
  }catch(e){}
}
var syncT;
function flash(txt){
  var el = document.getElementById("sync");
  el.textContent = txt || "сохранено"; el.classList.add("on");
  clearTimeout(syncT); syncT = setTimeout(function(){ el.classList.remove("on"); }, 1400);
}
function newId(){ return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function putRec(id, rec){
  recs[id] = rec; saveLocal(); render();
  if(DB) DB.collection("records").doc(id).set(rec).then(function(){ flash("сохранено"); },
    function(e){ flash("не сохранилось в облаке"); });
  else flash("сохранено на этом устройстве");
}
function delRec(id){
  delete recs[id]; saveLocal(); render();
  if(DB) DB.collection("records").doc(id).delete().then(function(){ flash("удалено"); }, function(){ flash("не удалилось в облаке"); });
  else flash("удалено");
}
function putSettings(){
  saveLocal();
  if(DB) DB.doc("settings/app").set(settings).then(function(){ flash("курс сохранён"); }, function(){});
}

/* ---------- chart ---------- */
function cumulative(key){
  var n = daysIn(key), arr = [];
  for(var i=0;i<n;i++) arr.push(0);
  list().forEach(function(r){
    if(ym(r.date)!==key) return;
    if(r.pending) return;
    if(r.kind!=="chat" && r.kind!=="vinted" && r.kind!=="other") return;
    arr[dayOf(r.date)-1] += usdOf(r);
  });
  var s=0; return arr.map(function(v){ s+=v; return s; });
}
function chartHTML(key){
  var prevKey = shiftMonth(key,-1);
  var cur = cumulative(key), prev = cumulative(prevKey);
  var n = cur.length;
  var top = Math.max(cur[n-1]||0, prev[prev.length-1]||0, 1);
  var X = function(i){ return (i/(n-1))*310; };
  var Y = function(v){ return 132 - (v/top)*120; };
  var at = function(a,i){ return a[Math.min(i, a.length-1)]||0; };
  var p1="", p2="";
  for(var i=0;i<n;i++){
    p1 += (i?"L":"M")+X(i).toFixed(1)+","+Y(cur[i]).toFixed(1)+" ";
    p2 += (i?"L":"M")+X(i).toFixed(1)+","+Y(at(prev,i)).toFixed(1)+" ";
  }
  var area = p1 + "L"+X(n-1).toFixed(1)+",136 L0,136 Z";
  var today = (key===ym(todayISO())) ? dayOf(todayISO()) : n;
  var sel = ui.day==null ? Math.min(today,n) : Math.min(ui.day,n);
  var future = sel>today;
  var hits=""; for(var k=0;k<n;k++) hits += '<button data-day="'+(k+1)+'" aria-label="День '+(k+1)+'"></button>';

  var dChat=0,dVin=0,dOther=0;
  list().forEach(function(r){
    if(ym(r.date)!==key || dayOf(r.date)!==sel || r.pending) return;
    if(r.kind==="chat") dChat+=usdOf(r);
    else if(r.kind==="vinted") dVin+=usdOf(r);
    else if(r.kind==="other") dOther+=usdOf(r);
  });
  var selPrev = at(prev,sel-1) - (sel>1 ? at(prev,sel-2) : 0);
  var pct = (X(sel-1)/310*100).toFixed(2);

  return '<div class="card">'
  + '<span class="lbl">СРАВНЕНИЕ С ПРОШЛЫМ МЕСЯЦЕМ</span>'
  + '<div class="legend"><span><i style="background:var(--acc)"></i> '+esc(monthName(key).split(" ")[0])+'</span>'
  + '<span style="color:var(--dim)"><i style="background:#5A5A5E"></i> '+esc(monthName(prevKey).split(" ")[0])+'</span></div>'
  + '<div class="chartbox"><svg viewBox="0 0 310 140" preserveAspectRatio="none" aria-hidden="true">'
  + '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#B8F23A" stop-opacity=".35"/><stop offset="100%" stop-color="#B8F23A" stop-opacity="0"/></linearGradient></defs>'
  + '<line x1="0" y1="46" x2="310" y2="46" stroke="#1F1F1F" stroke-dasharray="3 5"/>'
  + '<line x1="0" y1="92" x2="310" y2="92" stroke="#1F1F1F" stroke-dasharray="3 5"/>'
  + '<line x1="0" y1="136" x2="310" y2="136" stroke="#262626"/>'
  + '<path d="'+p2+'" fill="none" stroke="#5A5A5E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
  + '<path d="'+area+'" fill="url(#g)"/>'
  + '<path d="'+p1+'" fill="none" stroke="#B8F23A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
  + '</svg>'
  + '<div style="position:absolute;top:0;bottom:0;left:'+pct+'%;width:1px;background:#3A3A3C"></div>'
  + (future?"":'<div style="position:absolute;left:'+pct+'%;top:'+((Y(cur[sel-1])/140*100).toFixed(2))+'%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:6px;background:var(--acc);border:2px solid #000;box-shadow:0 0 12px #B8F23A"></div>')
  + '<div style="position:absolute;left:'+pct+'%;top:'+((Y(at(prev,sel-1))/140*100).toFixed(2))+'%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:5px;background:#8E8E93;border:2px solid #000"></div>'
  + '<div class="hit" data-chart="1">'+hits+'</div></div>'
  + '<div class="axis"><span>1</span><span>10</span><span>20</span><span>'+n+'</span></div>'
  + '<div class="selbox">'
  + '<div class="r"><span style="font-size:14px">'+sel+" "+genOf(key)+'</span><span style="font-size:16px;font-weight:500;color:var(--acc)">'+(future?"ещё впереди":"+"+money(dChat+dVin+dOther))+'</span></div>'
  + '<span class="hint">'+(future?"Этот день ещё не наступил":"Чаттинг +"+money(dChat)+" · Vinted +"+money(dVin)+(dOther?" · Другое +"+money(dOther):"")+" · с начала месяца "+money(cur[sel-1]))+'</span>'
  + '<div class="r" style="border-top:1px solid var(--line2);padding-top:8px"><span style="font-size:14px;color:var(--dim)">'+sel+" "+genOf(prevKey)+" · с начала месяца "+money(at(prev,sel-1))+'</span><span style="font-size:15px;color:var(--dim)">+'+money(selPrev)+'</span></div>'
  + '</div><span class="hint">Нажмите на любой день графика</span></div>';
}

/* ---------- rows ---------- */
function itemHTML(r, sign){
  return '<button class="item" data-edit="'+r.id+'">'
  + '<span><span class="t">'+esc(r.label)+'</span>'
  + (r.note||r.sub ? '<span class="s">'+esc(r.sub||"")+(r.sub&&r.note?" · ":"")+esc(r.note||"")+'</span>' : (r.sub?'<span class="s">'+esc(r.sub)+'</span>':''))
  + '</span>'
  + '<span class="v"'+(r.pending?' style="color:var(--dim)"':'')+'>'+(sign||"")+moneyRec(r)+'</span></button>';
}
function groupHTML(arr, key, sign){
  if(!arr.length) return "";
  var byDay = {};
  arr.forEach(function(r){ var d=dayOf(r.date); (byDay[d]=byDay[d]||[]).push(r); });
  return Object.keys(byDay).map(Number).sort(function(a,b){return b-a;}).map(function(d){
    var items = byDay[d];
    var s = sumUsd(items);
    return '<div class="group"><div class="dayhead"><b>'+d+" "+genOf(key)+'</b><span style="color:var(--acc)">'+(sign||"")+money(s)+'</span></div>'
    + '<div class="list">'+items.map(function(r){ return itemHTML(r,sign); }).join("")+'</div></div>';
  }).join("");
}

/* ---------- pages ---------- */
function pageOverview(key){
  var chat = inMonth(key,"chat"), vin = inMonth(key,"vinted"), other = inMonth(key,"other");
  var vinDone = vin.filter(function(r){ return !r.pending; });
  var vinPend = vin.filter(function(r){ return r.pending; });
  var total = sumUsd(chat)+sumUsd(vinDone)+sumUsd(other);
  var exp = sumUsd(inMonth(key,"expense"));
  return '<div class="card"><span class="lbl">ЗАРАБОТОК · '+esc(monthName(key).toUpperCase())+'</span>'
  + '<span class="big">'+money(total)+'</span>'
  + '<div class="seg"><button data-cur="usd" class="'+(ui.cur==="usd"?"on":"")+'">USD $</button><button data-cur="pln" class="'+(ui.cur==="pln"?"on":"")+'">PLN zł</button></div>'
  + '<button class="rate" data-rate="1">Курс: 1 USD = <u>'+nf(settings.rate).replace(",00","")+'</u> PLN · изменить</button></div>'
  + chartHTML(key)
  + '<div class="tiles">'
  + '<button class="tile" data-go="1"><span class="lbl">Чаттинг</span><span class="v">'+money(sumUsd(chat))+'</span></button>'
  + '<button class="tile" data-go="2"><span class="lbl">Vinted</span><span class="v">'+money(sumUsd(vinDone))+'</span>'+(vinPend.length?'<span class="hint">в процессе '+money(sumUsd(vinPend))+'</span>':"")+'</button>'
  + '<button class="tile" data-go="3"><span class="lbl">Расходы</span><span class="v">'+money(exp)+'</span></button>'
  + '<button class="tile" data-go="0"><span class="lbl">Осталось</span><span class="v" style="color:'+(total-exp>=0?"var(--acc)":"#FF8A8A")+'">'+money(total-exp)+'</span></button>'
  + '</div>'
  + (other.length ? '<span class="lbl" style="padding:6px 4px 0">ДРУГИЕ ДОХОДЫ</span><div class="list">'+other.map(function(r){ return itemHTML(r,"+"); }).join("")+'</div>' : "")
  + '<button class="ghost" data-io="1" style="width:100%;margin-top:4px">Экспорт и импорт данных</button>';
}
function pageChat(key){
  var arr = inMonth(key,"chat");
  var tot = {};
  arr.forEach(function(r){ var k=r.label; tot[k]=tot[k]||{sum:0,sales:0,pct:r.pct,ag:r.agency}; tot[k].sum+=usdOf(r); tot[k].sales+=(r.sales||0); });
  var ags = {};
  Object.keys(tot).forEach(function(p){ var a=tot[p].ag||"Другое"; (ags[a]=ags[a]||[]).push(p); });
  var blocks = Object.keys(ags).map(function(a){
    return '<div class="agblock"><span class="agname">'+esc(a)+'</span>'
    + ags[a].map(function(p){
        var t=tot[p];
        return '<div class="r"><span><span class="t">'+esc(p)+(t.pct?" · "+t.pct+"%":"")+'</span><span class="s">'+(t.sales?"Продажи: "+money(t.sales):"Твоя доля")+'</span></span><span class="v">'+money(t.sum)+'</span></div>';
      }).join("")
    + '</div>';
  }).join("");
  return '<div class="card"><span class="lbl">ЧАТТИНГ · '+esc(monthName(key).toUpperCase())+'</span><span class="mid" style="color:var(--acc)">'+money(sumUsd(arr))+'</span></div>'
  + (blocks ? '<div class="card" style="padding:4px 20px;gap:0">'+blocks+'</div>' : "")
  + (arr.length ? '<span class="lbl" style="padding:6px 4px 0">ИСТОРИЯ · нажмите, чтобы изменить</span>'+groupHTML(arr,key,"+") : '<div class="empty">За этот месяц записей нет</div>');
}
function pageVinted(key){
  var arr = inMonth(key,"vinted");
  var done = arr.filter(function(r){ return !r.pending; });
  var pend = arr.filter(function(r){ return r.pending; });
  var byAcc = {};
  done.forEach(function(r){ byAcc[r.sub||"—"] = (byAcc[r.sub||"—"]||0)+usdOf(r); });
  return '<div class="card"><span class="lbl">VINTED · '+esc(monthName(key).toUpperCase())+'</span><span class="mid" style="color:var(--acc)">'+money(sumUsd(done))+'</span>'
  + (pend.length?'<span class="hint">В процессе: '+money(sumUsd(pend))+'</span>':"")
  + '</div>'
  + (Object.keys(byAcc).length ? '<div class="list">'+Object.keys(byAcc).sort().map(function(a){
      return '<div class="item"><span class="t">'+esc(a)+'</span><span class="v">'+money(byAcc[a])+'</span></div>'; }).join("")+'</div>' : "")
  + (pend.length ? '<span class="lbl" style="padding:6px 4px 0">В ПРОЦЕССЕ</span><div class="list">'+pend.map(function(r){ return itemHTML(r,""); }).join("")+'</div>' : "")
  + (done.length ? '<span class="lbl" style="padding:6px 4px 0">ИСТОРИЯ · нажмите, чтобы изменить</span>'+groupHTML(done,key,"+") : (pend.length?"":'<div class="empty">За этот месяц записей нет</div>'));
}
function pageExpenses(key){
  var arr = inMonth(key,"expense");
  var sum = sumUsd(arr);
  var byCat = {};
  arr.forEach(function(r){ byCat[r.label] = (byCat[r.label]||0)+usdOf(r); });
  var cats = Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; });
  return '<div class="card"><span class="lbl">ПОТРАЧЕНО · '+esc(monthName(key).toUpperCase())+'</span><span class="mid">'+money(sum)+'</span></div>'
  + (cats.length ? '<div class="tiles">'+cats.map(function(c){
      var p = Math.round(byCat[c]/(sum||1)*100);
      return '<div class="tile"><span class="lbl">'+esc(c)+'</span><span class="v">'+money(byCat[c])+'</span><div class="bar"><i style="width:'+Math.max(p,2)+'%"></i></div><span class="hint">'+p+'% от всех расходов</span></div>';
    }).join("")+'</div>' : "")
  + (arr.length ? '<span class="lbl" style="padding:6px 4px 0">ПОКУПКИ · нажмите, чтобы изменить</span>'+groupHTML(arr,key,"") : '<div class="empty">За этот месяц расходов нет</div>');
}
function pageCash(key){
  var all = list().filter(function(r){ return r.kind==="cash"; });
  var totalAll = sumUsd(all);
  var arr = inMonth(key,"cash");
  return '<div class="card"><span class="lbl">НАЛИЧНЫЕ ДОМА</span><span class="mid">'+money(totalAll)+'</span><span class="hint">всего по всем месяцам · за '+esc(monthName(key).split(" ")[0].toLowerCase())+": "+money(sumUsd(arr))+'</span></div>'
  + (arr.length ? '<span class="lbl" style="padding:6px 4px 0">ИСТОРИЯ · нажмите, чтобы изменить</span>'+groupHTML(arr,key,"") : '<div class="empty">За этот месяц движений нет</div>');
}

/* ---------- sheets ---------- */
function chip(label, on, attr){ return '<button class="chip'+(on?" on":"")+'" '+attr+'>'+esc(label)+'</button>'; }
function chipSm(label, on, attr, plain){ return '<button class="chip sm'+(plain?" plain":"")+(on?" on":"")+'" '+attr+'>'+esc(label)+'</button>'; }

function addSheet(){
  var d = ui.draft;
  var isChat = d.type==="income" && d.src==="Чаттинг";
  var isVin = d.type==="income" && d.src==="Vinted";
  var isOther = d.type==="income" && d.src==="Другое";
  var isCash = d.type==="cash";
  var plat = isChat ? PLATFORMS.filter(function(p){ return p[0]===d.label; })[0] : null;
  var pct = plat ? plat[2] : 0;
  var amt = parseFloat(String(d.amount).replace(",",".")) || 0;
  var srcList = d.type==="income" ? ["Чаттинг","Vinted","Другое"] : CATS;

  var h = '<div class="hrow"><h2>'+(d.type==="income"?"Доход":d.type==="cash"?"Наличные":"Расход")+'</h2><button class="x" data-close="1" aria-label="Закрыть"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>';
  h += '<div class="chips">'
     + chip("Доход", d.type==="income", 'data-type="income"')
     + chip("Расход", d.type==="expense", 'data-type="expense"')
     + chip("Наличные", d.type==="cash", 'data-type="cash"')
     + '</div>';

  if(!isCash){
    h += '<div class="field"><span class="lbl">'+(d.type==="income"?"Источник":"Категория")+'</span><div class="chips">'
       + srcList.map(function(s){ return chip(s, d.src===s, 'data-src="'+esc(s)+'"'); }).join("")
       + '</div></div>';
  }
  if(isChat){
    h += '<div class="field"><span class="lbl">Платформа</span><div class="chips">'
       + PLATFORMS.map(function(p){ return chipSm(p[0]+(p[2]?" · "+p[2]+"%":""), d.label===p[0], 'data-label="'+esc(p[0])+'"'); }).join("")
       + '</div></div>';
  }
  if(isVin){
    h += '<div class="field"><span class="lbl">Аккаунт</span><div class="chips">'
       + ACCOUNTS.map(function(a){ return chipSm(a, d.label===a, 'data-label="'+esc(a)+'"'); }).join("")
       + '</div></div>';
  }
  if(isCash){
    h += '<div class="field"><span class="lbl">Что делаем</span><div class="chips">'
       + chip("Положил", d.cashIn!==false, 'data-cashin="1"')
       + chip("Взял", d.cashIn===false, 'data-cashin="0"')
       + '</div></div>';
  }
  h += '<div class="field"><label class="lbl" for="amt">'+(isChat&&pct?"Сумма продаж":"Сумма")+'</label>'
     + '<div class="amount"><input id="amt" inputmode="decimal" placeholder="0" value="'+esc(d.amount)+'"><span>'+(isChat?"$":"zł")+'</span></div>'
     + (isChat&&pct ? '<div class="r"><span class="hint">Твоя доля · '+pct+'%</span><span style="font-size:15px;font-weight:500;color:var(--acc)">$'+(amt*pct/100).toFixed(2)+'</span></div>' : "")
     + '</div>';
  if(isVin){
    h += '<button class="toggle'+(d.pending?" on":"")+'" data-pending="1"><span><span class="t">В процессе</span><span class="s">не попадёт в итог, пока продажа не завершится</span></span><span class="sw"><i></i></span></button>';
  }
  h += '<div class="field"><label class="lbl" for="dt">Дата</label><input class="txt" id="dt" type="date" value="'+esc(d.date)+'"></div>';
  h += '<div class="field"><label class="lbl" for="nt">'+(isOther||isCash?"Комментарий":"Заметка (необязательно)")+'</label><input class="txt" id="nt" placeholder="'+(isOther?"например: подработка":isCash?"например: с продажи шарфа":"например: шарф")+'" value="'+esc(d.note)+'"></div>';
  h += '<div class="btns"><button class="primary" data-save="1"'+(amt>0?"":" disabled")+'>Сохранить</button></div>';
  return h;
}

  h += '<div class="field"><label class="lbl" for="amt">'+(r.kind==="chat"&&r.pct?"Сумма продаж":"Сумма")+'</label>'

     + (r.kind==="chat"&&r.pct ? '<div class="r"><span class="hint">Твоя доля · '+r.pct+'%</span><span style="font-size:15px;font-weight:500;color:var(--acc)">$'+(amt*r.pct/100).toFixed(2)+'</span></div>' : "")

    h += '<button class="toggle" data-complete="1"><span><span class="t">Завершить продажу</span><span class="s">попадёт в итог месяца</span></span><span class="sw"><i></i></span></button>';
  }

function ioSheet(){
  return '<div class="hrow"><h2>Экспорт и импорт</h2><button class="x" data-close="1" aria-label="Закрыть"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>'
  + '<span class="hint">«Выгрузить» — покажет все ваши записи текстом. Скопируйте и сохраните где угодно: это резервная копия. «Добавить записи» — вставьте сюда подготовленный текст и нажмите, записи добавятся к тем, что уже есть.</span>'
  + '<div class="field"><textarea id="io" class="txt" style="height:170px;padding:12px 16px;resize:none;line-height:1.4;font-size:13px" placeholder="Вставьте сюда текст для импорта"></textarea></div>'
  + '<div class="btns"><button class="ghost" data-export="1">Выгрузить</button><button class="primary" data-import="1">Добавить записи</button></div>'
  + '<button class="ghost danger" data-clear="1" style="width:100%">'+((ui.draft && ui.draft.confirmClear) ? "Нажмите ещё раз — записи сотрутся" : "Удалить все записи")+'</button>';
}

function importRecords(text){
  var arr;
  try{ arr = JSON.parse(text); }catch(e){ return "Текст не читается — вставьте его целиком, вместе со скобками"; }
  if(!arr || typeof arr.length!=="number") return "Это не список записей";
  var ok=0, bad=0;
  arr.forEach(function(o){
    if(!o || typeof o!=="object"){ bad++; return; }
    var kinds = ["chat","vinted","other","expense","cash"];
    if(kinds.indexOf(o.kind)<0){ bad++; return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(o.date||""))){ bad++; return; }
    var a = Number(o.amount);
    if(!isFinite(a) || a===0){ bad++; return; }
    var id = (typeof o.id==="string" && o.id && !recs[o.id]) ? o.id : newId();
    var rec = {
      id:id, kind:o.kind, date:o.date,
      cur: o.cur==="usd" ? "usd" : "pln",
      amount: a,
      label: String(o.label || (o.kind==="chat"?"Платформа":o.kind==="vinted"?"Продажа":o.kind==="expense"?"Разное":"Другое")),
      sub: o.sub ? String(o.sub) : "",
      note: o.note ? String(o.note) : "",
      at: Date.now()
    };
    if(o.kind==="chat"){ rec.pct = o.pct ? Number(o.pct) : null; rec.sales = o.sales ? Number(o.sales) : null; rec.agency = o.agency ? String(o.agency) : null; }
    if(o.kind==="vinted") rec.pending = !!o.pending;
    recs[id] = rec; ok++;
    if(DB) DB.collection("records").doc(id).set(rec).then(function(){},function(){});
  });
  saveLocal(); render();
  return "Добавлено записей: "+ok+(bad?", пропущено: "+bad:"");
}

function rateSheet(){
  return '<div class="hrow"><h2>Курс USD → PLN</h2><button class="x" data-close="1" aria-label="Закрыть"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>'
  + '<div class="field"><label class="lbl" for="amt">1 доллар стоит</label><div class="amount"><input id="amt" inputmode="decimal" value="'+esc(ui.draft.amount)+'"><span>zł</span></div></div>'
  + '<span class="hint">Курс нужен, чтобы показывать один итог в двух валютах. Проверьте его раз в месяц.</span>'
  + '<div class="btns"><button class="primary" data-rate-save="1">Сохранить</button></div>';
}

function renderModal(){
  var host = document.getElementById("modal");
  if(!ui.modal){ host.innerHTML=""; return; }
  var inner = ui.modal.kind==="add" ? addSheet() : ui.modal.kind==="edit" ? editSheet() : ui.modal.kind==="io" ? ioSheet() : rateSheet();
  host.innerHTML = '<div class="scrim" data-scrim="1"><div class="sheet">'+inner+'</div></div>';
}

/* ---------- render ---------- */
function render(){
  var months = monthsAvailable();
  if(!ui.month || months.indexOf(ui.month)<0) ui.month = months[0];
  var idx = months.indexOf(ui.month);
  document.getElementById("title").textContent = TABS[ui.page];
  document.getElementById("mlabel").textContent = monthName(ui.month);
  document.getElementById("mprev").disabled = idx>=months.length-1;
  document.getElementById("mnext").disabled = idx<=0;
  document.getElementById("tabs").innerHTML = TABS.map(function(t,i){
    return '<button class="tab'+(i===ui.page?" on":"")+'" data-tab="'+i+'">'+t+'</button>'; }).join("");
  document.getElementById("dots").innerHTML = TABS.map(function(t,i){
    return '<i class="'+(i===ui.page?"on":"")+'"></i>'; }).join("");
  var k = ui.month;
  document.getElementById("p0").innerHTML = pageOverview(k);
  document.getElementById("p1").innerHTML = pageChat(k);
  document.getElementById("p2").innerHTML = pageVinted(k);
  document.getElementById("p3").innerHTML = pageExpenses(k);
  document.getElementById("p4").innerHTML = pageCash(k);
  renderModal();
}

function goPage(i){
  ui.page = Math.max(0, Math.min(TABS.length-1, i));
  var pages = document.getElementById("pages");
  pages.scrollTo({ left: ui.page*pages.clientWidth, behavior:"smooth" });
  render();
}

/* ---------- events ---------- */
document.getElementById("pages").addEventListener("scroll", function(){
  var p = Math.round(this.scrollLeft/this.clientWidth);
  if(p!==ui.page){ ui.page=p;
    document.getElementById("title").textContent = TABS[p];
    document.querySelectorAll("#tabs .tab").forEach(function(b,i){ b.classList.toggle("on", i===p); });
    document.querySelectorAll("#dots i").forEach(function(b,i){ b.classList.toggle("on", i===p); });
  }
});
document.getElementById("mprev").addEventListener("click", function(){
  var m = monthsAvailable(); var i = m.indexOf(ui.month);
  if(i<m.length-1){ ui.month=m[i+1]; ui.day=null; render(); }
});
document.getElementById("mnext").addEventListener("click", function(){
  var m = monthsAvailable(); var i = m.indexOf(ui.month);
  if(i>0){ ui.month=m[i-1]; ui.day=null; render(); }
});
document.getElementById("fab").addEventListener("click", function(){
  ui.draft = { type:"income", src:"Чаттинг", label:"Fanvue", amount:"", pending:false, date:todayISO(), note:"", cashIn:true };
  ui.modal = { kind:"add" };
  renderModal();
});

document.body.addEventListener("click", function(e){
  var t = e.target.closest("[data-tab],[data-go],[data-cur],[data-rate],[data-day],[data-edit],[data-close],[data-scrim],[data-type],[data-src],[data-label],[data-cashin],[data-pending],[data-save],[data-update],[data-delete],[data-complete],[data-rate-save],[data-io],[data-export],[data-import],[data-clear]");
  if(!t) return;
  var d = t.dataset;

  if(d.scrim!==undefined && t===e.target){ ui.modal=null; renderModal(); return; }
  if(d.close!==undefined){ ui.modal=null; renderModal(); return; }
  if(d.tab!==undefined){ goPage(+d.tab); return; }
  if(d.go!==undefined){ goPage(+d.go); return; }
  if(d.cur!==undefined){ ui.cur=d.cur; render(); return; }
  if(d.day!==undefined){ ui.day=+d.day; render(); return; }
  if(d.rate!==undefined){ ui.draft={amount:String(settings.rate).replace(".",",")}; ui.modal={kind:"rate"}; renderModal(); return; }
  if(d.io!==undefined){ ui.draft={}; ui.modal={kind:"io"}; renderModal(); return; }
  if(d.export!==undefined){
    var ta = document.getElementById("io");
    ta.value = JSON.stringify(list(), null, 1);
    ta.focus(); ta.select();
    flash("скопируйте текст"); return;
  }
  if(d.clear!==undefined){
    if(!ui.draft.confirmClear){ ui.draft.confirmClear = true; renderModal(); return; }
    var ids = Object.keys(recs);
    recs = {}; saveLocal();
    if(DB) ids.forEach(function(id){ DB.collection("records").doc(id).delete().then(function(){},function(){}); });
    ui.modal=null; render(); flash("стёрто записей: "+ids.length); return;
  }
  if(d.import!==undefined){
    var ta2 = document.getElementById("io");
    var msg = importRecords(ta2.value||"");
    ui.modal=null; render(); flash(msg); return;
  }
  if(d.edit!==undefined){
    var r = recs[d.edit]; if(!r) return;
    ui.draft = { amount: String(r.kind==="chat"&&r.pct ? (r.sales||r.amount) : r.amount).replace(".",",") };
    ui.modal = { kind:"edit", id:d.edit }; renderModal(); return;
  }

  /* --- inside sheets --- */
  var dr = ui.draft;
  if(d.type!==undefined){
    dr.type=d.type;
    dr.src = d.type==="income" ? "Чаттинг" : CATS[0];
    dr.label = d.type==="income" ? "Fanvue" : CATS[0];
    dr.pending=false; renderModal(); return;
  }
  if(d.src!==undefined){
    dr.src=d.src;
    dr.label = d.src==="Чаттинг" ? "Fanvue" : d.src==="Vinted" && dr.type==="income" ? ACCOUNTS[0] : d.src;
    dr.pending=false; renderModal(); return;
  }
  if(d.label!==undefined){ dr.label=d.label; renderModal(); return; }
  if(d.cashin!==undefined){ dr.cashIn = d.cashin==="1"; renderModal(); return; }
  if(d.pending!==undefined){ dr.pending=!dr.pending; renderModal(); return; }

  if(d.save!==undefined){
    var inp = document.getElementById("amt");
    var v = parseFloat(String(inp.value).replace(",",".")); if(!(v>0)) return;
    var date = document.getElementById("dt").value || todayISO();
    var note = document.getElementById("nt").value || "";
    var rec, id = newId();
    if(dr.type==="income" && dr.src==="Чаттинг"){
      var p = PLATFORMS.filter(function(x){ return x[0]===dr.label; })[0] || PLATFORMS[2];
      rec = { id:id, kind:"chat", cur:"usd", amount: p[2] ? v*p[2]/100 : v, sales: p[2]? v : null, pct:p[2]||null,
              agency:p[1], label:p[0], sub:(p[1]?p[1]+" · ":"")+(p[2]?p[2]+"%":"своя сумма")+(p[2]?" · продажи $"+v.toFixed(2):""),
              date:date, note:note, at:Date.now() };
    } else if(dr.type==="income" && dr.src==="Vinted"){
      rec = { id:id, kind:"vinted", cur:"pln", amount:v, label:"Продажа", sub:dr.label, pending:!!dr.pending, date:date, note:note, at:Date.now() };
    } else if(dr.type==="income"){
      rec = { id:id, kind:"other", cur:"pln", amount:v, label:"Другое", sub:"Доход", date:date, note:note, at:Date.now() };
    } else if(dr.type==="cash"){
      rec = { id:id, kind:"cash", cur:"pln", amount: dr.cashIn===false ? -v : v, label: dr.cashIn===false?"Взял":"Положил", sub:"Наличные дома", date:date, note:note, at:Date.now() };
    } else {
      rec = { id:id, kind:"expense", cur:"pln", amount:v, label:dr.src, sub:"Расход", date:date, note:note, at:Date.now() };
    }
    ui.modal=null; ui.month = ym(date); putRec(id, rec); return;
  }

  if(d.update!==undefined){
    var r2 = recs[ui.modal.id]; if(!r2) return;
    var v2 = parseFloat(String(document.getElementById("amt").value).replace(",",".")); if(!(v2>0)) return;
    var c = JSON.parse(JSON.stringify(r2));
    if(c.kind==="chat" && c.pct){ c.sales=v2; c.amount=v2*c.pct/100; c.sub=(c.agency?c.agency+" · ":"")+c.pct+"% · продажи $"+v2.toFixed(2); }
    else if(c.kind==="cash"){ c.amount = c.amount<0 ? -v2 : v2; }
    else c.amount=v2;
    c.date = document.getElementById("dt").value || c.date;
    c.note = document.getElementById("nt").value || "";
    ui.modal=null; ui.month = ym(c.date); putRec(c.id, c); return;
  }
  if(d.complete!==undefined){
    var r3 = recs[ui.modal.id]; if(!r3) return;
    var c3 = JSON.parse(JSON.stringify(r3)); c3.pending=false;
    var v3 = parseFloat(String(document.getElementById("amt").value).replace(",",".")); if(v3>0) c3.amount=v3;
    ui.modal=null; putRec(c3.id, c3); return;
  }
  if(d.delete!==undefined){
    var id4 = ui.modal.id; ui.modal=null; delRec(id4); return;
  }
  if(d.rateSave!==undefined){
    var rv = parseFloat(String(document.getElementById("amt").value).replace(",","."));
    if(rv>0.5 && rv<20){ settings.rate=rv; putSettings(); }
    ui.modal=null; render(); return;
  }
});

document.body.addEventListener("input", function(e){
  if(e.target.id!=="amt" || !ui.modal) return;
  ui.draft.amount = e.target.value;
  var sheet = e.target.closest(".sheet"); if(!sheet) return;
  var save = sheet.querySelector("[data-save]");
  var v = parseFloat(String(e.target.value).replace(",",".")) || 0;
  if(save) save.disabled = !(v>0);
  var shareRow = sheet.querySelector(".r span:last-child");
  var hintRow = sheet.querySelector(".r .hint");
  if(hintRow && shareRow){
    var m = /(\d+)%/.exec(hintRow.textContent);
    if(m) shareRow.textContent = "$"+(v*(+m[1])/100).toFixed(2);
  }
});

/* ---------- boot ---------- */
loadLocal();
render();

var hasClaude = false;
try{ hasClaude = (typeof claude!=="undefined") && !!claude && typeof claude.use==="function"; }catch(e){ hasClaude = false; }
if(hasClaude) claude.use("db").then(function(db){
  if(!db) return;
  DB = db;
  DB.doc("settings/app").onSnapshot(function(s){
    if(s.exists && s.data() && s.data().rate){ settings.rate = s.data().rate; saveLocal(); render(); }
  }, function(){});
  DB.collection("records").onSnapshot(function(snap){
    var fresh = {};
    snap.docs.forEach(function(doc){ var o=doc.data()||{}; o.id=doc.id; fresh[doc.id]=o; });
    var localOnly = Object.keys(recs).filter(function(k){ return !fresh[k]; });
    if(snap.empty && localOnly.length){
      localOnly.forEach(function(k){ DB.collection("records").doc(k).set(recs[k]); });
      return;
    }
    recs = fresh; saveLocal(); render();
  }, function(){});
}, function(){});

})();
</script>
</body>
</html>
